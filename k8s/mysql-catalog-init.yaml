# Scripts de inicializacion de MySQL (copia de db/). MySQL los ejecuta al arrancar con datos vacios.
# Si cambian los archivos de db/, actualizar tambien este ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-catalog-init
  namespace: library-ns
data:
